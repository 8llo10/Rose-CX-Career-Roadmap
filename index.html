<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7c8df">
<title>ROSE CX — Career Map</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="shell">
  <header class="hud glass">
    <div class="brand">ROSE <b>CX</b></div>
    <div class="hud-title">CAREER MAP</div>
    <div class="level-orb">04Y</div>
  </header>

  <main>
    <section class="intro">
      <span class="quest-tag">CAREER QUEST</span>
      <h1>اختاري مسارك.</h1>
    </section>

    <section class="map-wrap">
      <div class="world-line"></div>

      <div class="checkpoint start">
        <span class="checkpoint-label">START</span>
        <button class="node current">
          <span class="node-orb">★</span>
          <span class="node-name">Customer Service<br>Call Center</span>
        </button>
      </div>

      <div class="fork-title"><span>✦</span> اختاري التخصص <span>✦</span></div>

      <section class="realm realm-lead">
        <div class="realm-head"><span>01</span><b>Leadership & Operations</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Contact Center<br>Team Leader</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">Contact Center<br>Supervisor</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">Operations<br>Manager</span></button>
          <button class="node"><span class="node-orb">4</span><span class="node-name">Contact Center<br>Manager</span></button>
        </div>
      </section>

      <section class="realm realm-quality">
        <div class="realm-head"><span>02</span><b>Quality & Service Excellence</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Quality<br>Analyst</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">Senior Quality<br>Analyst</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">Quality<br>Supervisor</span></button>
          <button class="node"><span class="node-orb">4</span><span class="node-name">Quality<br>Manager</span></button>
          <button class="node merge"><span class="node-orb">5</span><span class="node-name">Service Excellence<br>Manager</span></button>
        </div>
      </section>

      <section class="realm realm-complaints">
        <div class="realm-head"><span>03</span><b>Complaints & Escalations</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Complaints & Escalations<br>Specialist</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">Senior Complaints<br>Specialist</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">Complaints<br>Supervisor</span></button>
          <button class="node merge"><span class="node-orb">4</span><span class="node-name">Complaints & CX<br>Manager</span></button>
        </div>
      </section>

      <section class="realm realm-wfm">
        <div class="realm-head"><span>04</span><b>Workforce Management</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Real-Time Analyst<br>RTA</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">WFM Analyst<br>Scheduler</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">WFM Planner<br>Senior WFM</span></button>
          <button class="node"><span class="node-orb">4</span><span class="node-name">WFM<br>Supervisor</span></button>
          <button class="node merge"><span class="node-orb">5</span><span class="node-name">WFM<br>Manager</span></button>
        </div>
      </section>

      <section class="realm realm-cx">
        <div class="realm-head"><span>05</span><b>Customer Experience</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Customer Experience<br>Specialist</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">Senior CX<br>Specialist</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">CX<br>Manager</span></button>
        </div>
      </section>

      <section class="realm realm-training">
        <div class="realm-head"><span>06</span><b>Training & Development</b></div>
        <div class="path">
          <button class="node"><span class="node-orb">1</span><span class="node-name">Contact Center<br>Trainer</span></button>
          <button class="node"><span class="node-orb">2</span><span class="node-name">Senior Trainer<br>Training Specialist</span></button>
          <button class="node"><span class="node-orb">3</span><span class="node-name">Training<br>Supervisor</span></button>
          <button class="node merge"><span class="node-orb">4</span><span class="node-name">Training<br>Manager</span></button>
        </div>
      </section>

      <section class="executive-zone">
        <div class="fork-title"><span>✦</span> EXECUTIVE PATH <span>✦</span></div>
        <div class="exec-row">
          <button class="node executive"><span class="node-orb">H</span><span class="node-name">Head of Customer<br>Operations</span></button>
          <button class="node executive"><span class="node-orb">H</span><span class="node-name">Head of Customer<br>Experience</span></button>
        </div>
        <div class="exec-connector"></div>
        <div class="exec-row">
          <button class="node executive"><span class="node-orb">D</span><span class="node-name">Director of Customer<br>Operations</span></button>
          <button class="node executive"><span class="node-orb">D</span><span class="node-name">Director of Customer<br>Experience</span></button>
        </div>
        <div class="exec-connector"></div>
        <div class="exec-row">
          <button class="node executive"><span class="node-orb">VP</span><span class="node-name">VP Customer<br>Operations</span></button>
          <button class="node executive"><span class="node-orb">VP</span><span class="node-name">VP Customer<br>Experience</span></button>
        </div>
      </section>

      <div class="convergence">
        <div class="portal-lines"><i></i><i></i><i></i></div>
        <span class="checkpoint-label">FINAL LEVEL</span>
        <button class="node boss">
          <span class="crown">♛</span>
          <span class="node-name">Chief Customer Officer<br><b>CCO / CXO</b></span>
        </button>
      </div>
    </section>
  </main>
</div>
<script src="app.js"></script>
</body>
</html>
